[package]
name = "aegn-agent"
version = "0.8.2"
edition = "2021"
description = "AEGN Security: sistema de segurança dos computadores da Escola AEGN"
authors = ["Escola AEGN - IT"]
license = "MIT"
# El binario se instala como `aegn` para uso comodo desde la consola del administrador.
default-run = "aegn"

[[bin]]
name = "aegn"
path = "src/main.rs"

[dependencies]
# CLI: parseo de argumentos para modo no interactivo (scripts / despliegue).
clap = { version = "4.5", features = ["derive"] }
# TUI + ASCII art para el menu interactivo del administrador.
ratatui = "0.29"
crossterm = "0.28"
figlet-rs = "0.1"
# Manejo de errores ergonomico.
anyhow = "1"
# Contraseña de administración: PBKDF2-HMAC-SHA256 con sal aleatoria.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.2"
# Lectura de la contraseña en consola sin eco.
rpassword = "7"

[target.'cfg(windows)'.dependencies]
# La contraseña se guarda en HKLM, donde solo escriben los administradores.
winreg = "0.55"

[profile.release]
opt-level = "z"
lto = true
strip = true
